name: Repository and core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check repository and version evidence
        run: python tools/check_repository.py
      - name: Test image processing and wire protocol
        shell: pwsh
        run: ./tests/run-core.ps1 -JavaHome $env:JAVA_HOME
